# Nginx for MatuPicks API — picks.logsfm.com
# Matches existing logsfm SSL cert path used by iur/radio.
# Install (only this site):
#   sudo cp deploy/nginx.picks.logsfm.com.conf /etc/nginx/sites-available/picks.logsfm.com
#   sudo ln -sf /etc/nginx/sites-available/picks.logsfm.com /etc/nginx/sites-enabled/picks.logsfm.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream picks_api {
    server 127.0.0.1:3009;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name picks.logsfm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name picks.logsfm.com;

    ssl_certificate /etc/nginx/ssl/matu-ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/matu-ai/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://picks_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
